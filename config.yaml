# Rancho's devices. Secrets stay in .env.
#
# Camera names appear in Telegram messages and alerts. Photos arrive in this order.
# Credentials stay in .env (CAMERA_USERNAME / CAMERA_PASSWORD).
#
# `alerts` is what a camera sends to Telegram: person (default), vehicle, animal.
# All alert only while armed. Persons get a photo and the siren; vehicles and
# animals get a photo (at most every 5 min) and never the siren.

cameras:
  - name: Patio
    host: 10.10.0.11
  - name: Bomba
    host: 10.10.0.10
    # Something has been leaving droppings by the pump.
    # alerts: [person, animal]
  - name: Puerta
    host: 10.10.0.12
  - name: Cocina
    host: 10.10.0.13

# Z-Wave door/window sensors. `node` is the number from `uv run task zwave list`.
# Opening one while armed sounds the siren; arming is refused while one is open.
# A removed cover or a sensor that goes silent alerts whether armed or not.
sensors:
  - name: Ventana cocina
    node: 4
  - name: Ventana leña
    node: 5
  - name: Ventana starlink
    node: 6

# Where the house is (Ecatzingo, Estado de México), for working out dusk.
location:
  latitude: 18.95
  longitude: -98.75

# Z-Wave relays switched on a schedule. `on_at`/`off_at` are "HH:MM" (quoted) or
# dusk (civil twilight at `location`). Each time shifts randomly by up to
# `jitter` minutes either way (default 30), picked fresh every night. Switching
# the light by hand (or with /encender, /apagar) overrides the schedule until
# its next on or off time. Nothing goes to Telegram; /estado shows each light.
lights:
  - name: Patio
    node: 7
    on_at: dusk
    off_at: "03:00"
