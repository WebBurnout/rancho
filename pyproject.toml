[project]
name = "rancho"
version = "0.1.0"
description = "Asyncio alarm service for Rancho"
requires-python = ">=3.12"
dependencies = [
    "astral>=3.2,<4",
    "gpiod>=2.2,<3",
    "pillow>=11,<14",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=22,<23",
    "pyyaml>=6,<7",
    "reolink-aio==0.22.0",
    "zwave-js-server-python==0.74.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "taskipy>=1.14,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.taskipy.tasks]
restart = "sudo systemctl restart rancho.service"
test = "pytest"
logs = "journalctl -u rancho.service -f -n 50"
zwave = "python -m rancho.zwave_cli"
