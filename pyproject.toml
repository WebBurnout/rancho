[project]
name = "rancho"
version = "0.1.0"
description = "Asyncio alarm service for Rancho"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=22,<23",
    "reolink-aio==0.22.0",
]

[dependency-groups]
dev = ["taskipy>=1.14,<2"]

[tool.uv]
package = false

[tool.taskipy.tasks]
restart = "sudo systemctl restart rancho.service"
